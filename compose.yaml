services:
  links:
    build: .
    restart: unless-stopped
    environment:
      LINKS_ADDR: ":8080"
      LINKS_PUBLIC_URL: "${LINKS_PUBLIC_URL:-http://localhost:8080}"
      LINKS_DATA_DIR: /data
      LINKS_ALLOW_PRIVATE_FETCH: "${LINKS_ALLOW_PRIVATE_FETCH:-false}"
    ports:
      - "${LINKS_PORT:-8080}:8080"
    volumes:
      - ./data:/data
