<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>保存到拾页</title>
    <link rel="stylesheet" href="extension.css">
  </head>
  <body class="popup-body">
    <main class="popup">
      <header class="extension-brand"><span class="extension-mark">拾</span><span>拾页</span></header>
      <p class="popup-caption">保存当前网页</p>
      <label class="toggle"><input id="unreadInput" type="checkbox"><span>稍后阅读</span></label>
      <label class="toggle"><input id="starredInput" type="checkbox"><span>收藏</span></label>
      <label class="toggle archive-toggle"><input id="archiveInput" type="checkbox"><span>归档当前正文</span></label>
      <p class="privacy-note">仅在勾选时读取并上传当前页面正文，适合登录后页面。</p>
      <button id="saveButton" class="primary" type="button">保存链接</button>
      <p id="status" class="status" role="status"></p>
      <button id="optionsButton" class="link-button" type="button">连接设置</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
