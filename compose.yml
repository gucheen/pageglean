services:
  pageglean:
    build: .
    user: "${PAGEGLEAN_UID:-1000}:${PAGEGLEAN_GID:-1000}"
    restart: unless-stopped
    environment:
      PAGEGLEAN_ADDR: ":8080"
      PAGEGLEAN_PUBLIC_URL: "${PAGEGLEAN_PUBLIC_URL:-}"
      PAGEGLEAN_DATA_DIR: /data
      PAGEGLEAN_OIDC_ISSUER: "${PAGEGLEAN_OIDC_ISSUER:-}"
      PAGEGLEAN_OIDC_CLIENT_ID: "${PAGEGLEAN_OIDC_CLIENT_ID:-}"
      PAGEGLEAN_OIDC_CLIENT_SECRET: "${PAGEGLEAN_OIDC_CLIENT_SECRET:-}"
      PAGEGLEAN_OIDC_OWNER_SUBJECT: "${PAGEGLEAN_OIDC_OWNER_SUBJECT:-}"
      PAGEGLEAN_WEBHOOK_MODE: "${PAGEGLEAN_WEBHOOK_MODE:-generic}"
      PAGEGLEAN_WEBHOOK_URL: "${PAGEGLEAN_WEBHOOK_URL:-}"
      PAGEGLEAN_WEBHOOK_SECRET: "${PAGEGLEAN_WEBHOOK_SECRET:-}"
      PAGEGLEAN_WEBHOOK_TOKEN: "${PAGEGLEAN_WEBHOOK_TOKEN:-}"
      PAGEGLEAN_ALLOW_PRIVATE_FETCH: "${PAGEGLEAN_ALLOW_PRIVATE_FETCH:-}"
    ports:
      - "${PAGEGLEAN_PORT:-8080}:8080"
    volumes:
      - ./data:/data
